<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1918">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>MultiChess Puzzle Race</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
<script src="vendor/peerjs.min.js"></script>
</head>
<body>
<div class="app">
<header><div class="logo">Multi<span>Chess</span></div><div class="hdr-r"><span id="status"></span><button id="muteBtn" class="icon-btn" aria-label="Toggle sound"></button></div></header>

<main>
  <section id="home" class="screen">
    <div class="home-head"><h1>Puzzle race</h1><p>Race your friends through checkmate puzzles. Host a room, share the code, first to find the mate wins the round.</p></div>
    <label class="field"><span class="label">Your name</span><input id="name" maxlength="16" placeholder="Player"></label>
    <div class="card">
      <h2>Host a room</h2>
      <label class="field"><span class="label">Rounds</span><select id="rounds"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label>
      <label class="field"><span class="label">Difficulty</span><select id="diff"><option value="mix" selected>Mixed</option><option value="m1">Mate in 1</option><option value="m2">Mate in 2</option></select></label>
      <label class="field"><span class="label">Round time</span><select id="time"><option value="30">30s</option><option value="60" selected>60s</option><option value="90">90s</option></select></label>
      <button id="hostBtn" class="big pink">Create room</button>
    </div>
    <div class="card">
      <h2>Join a room</h2>
      <input id="codeIn" maxlength="5" autocomplete="off" autocorrect="off" spellcheck="false" inputmode="text" placeholder="CODE" autocapitalize="characters">
      <button id="joinBtn" class="big sky">Join</button>
    </div>
  </section>

  <section id="lobby" class="screen hidden">
    <span class="label">Room code</span>
    <div class="code" id="codeOut"></div>
    <button id="copyBtn" class="ghost">Copy invite link</button>
    <h3 class="label">Players</h3>
    <ul id="lobbyList" class="players"></ul>
    <button id="startBtn" class="big pink hidden">Start game</button>
    <p id="waitMsg" class="muted">Waiting for the host to start…</p>
  </section>

  <section id="game" class="screen hidden">
    <div class="topbar">
      <span id="roundLbl"></span>
      <span id="taskLbl"></span>
      <span id="timer" class="timer"></span>
    </div>
    <div class="layout">
      <div class="boardwrap"><div id="board"></div><div id="feedback"></div></div>
      <aside><h3 class="label">Scores</h3><ul id="scoreList" class="players"></ul></aside>
    </div>
  </section>

  <section id="results" class="screen hidden">
    <h2 class="title">Final standings</h2>
    <ol id="finalList" class="players final"></ol>
    <button id="againBtn" class="big pink hidden">Play again</button>
    <button id="homeBtn" class="ghost danger">Leave</button>
  </section>
</main>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
